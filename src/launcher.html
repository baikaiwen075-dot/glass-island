<!doctype html><html lang="zh-CN" class="launcher-html"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>璃屿 · 应用大面板</title><link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./launcher.css"><link rel="stylesheet" href="./reorder.css"></head>
<body class="launcher-body"><main class="launcher-shell">
  <header class="launcher-header"><div class="launcher-brand"><span class="launcher-logo" data-icon="island"></span><div><h1>我的应用岛屿</h1><p>你的软件，在这里井然有序。</p></div></div><div class="launcher-window-actions"><span class="launch-hotkey">Ctrl + Shift + Space</span><button id="settings" class="icon-button" title="外观与组件设置" aria-label="外观与组件设置"><span data-icon="settings"></span></button><button id="close" class="icon-button" aria-label="收起应用大面板"><span data-icon="close"></span></button></div></header>
  <div class="launcher-controls"><label class="app-search"><span data-icon="globe"></span><input id="search" type="search" placeholder="搜索软件、文件或分组…" autocomplete="off" aria-label="搜索应用"><kbd>Enter</kbd></label><button id="pick-files" class="button primary"><span data-icon="plus"></span>添加软件</button><button id="pick-folder" class="button outline" title="添加文件夹入口"><span data-icon="folder"></span>文件夹</button></div>
  <div class="launcher-import"><span>从你的电脑导入</span><button id="scan-desktop" class="text-button"><span data-icon="monitor"></span>读取桌面</button><button id="scan-startmenu" class="text-button"><span data-icon="grid"></span>读取开始菜单</button><button id="refresh-icons" class="text-button"><span data-icon="image"></span>刷新图标</button><span id="app-count"></span></div>
  <nav id="groups" class="group-tabs" aria-label="应用分组"></nav>
  <div id="app-grid" class="app-grid"></div><div id="app-empty" class="app-empty" hidden><span data-icon="monitor"></span><h2>把你的软件，放进这块玻璃。</h2><p>添加 EXE 或 LNK 快捷方式，也可以直接从桌面拖入。<br>只创建入口，原来的软件和文件保持原位。</p><button id="empty-import" class="button primary">从桌面挑选软件 <span data-icon="arrow"></span></button></div>
  <footer class="launcher-footer"><span><span class="status-dot"></span><span id="launcher-status">本机应用 · 本地保存</span></span><span>点击启动 · 拖动换位 · 右键编辑分组</span></footer>
  </main><div id="launcher-toast" class="toast" role="status" hidden></div>
  <dialog id="import-dialog"><div class="dialog-heading"><div><div class="overline">IMPORT YOUR APPLICATIONS</div><h2 id="import-title">选择要添加的软件</h2></div><button id="cancel-import" class="icon-button" aria-label="取消导入"><span data-icon="close"></span></button></div><label class="import-select-all"><input id="select-all" type="checkbox" checked>全选<span id="candidate-count"></span></label><div id="candidate-list" class="candidate-list"></div><p class="field-hint">读取操作不会移动桌面文件。检查列表后，添加你需要的入口。</p><button id="confirm-import" class="button primary full-width">添加已选</button></dialog>
  <dialog id="entry-dialog"><div class="dialog-heading"><h2>编辑应用入口</h2><button id="cancel-entry" class="icon-button" aria-label="关闭"><span data-icon="close"></span></button></div><form id="entry-form"><label class="field-label" for="entry-name">显示名称</label><input id="entry-name" maxlength="80" required><label class="field-label" for="entry-group">分组（可输入新名称）</label><input id="entry-group" maxlength="32" list="group-options" placeholder="未分组"><datalist id="group-options"></datalist><label class="entry-pin"><input id="entry-pinned" type="checkbox">固定到软件 Dock</label><p id="entry-path" class="entry-path"></p><div class="entry-secondary"><button id="pick-entry-icon" type="button" class="button outline"><span data-icon="image"></span>更换图标</button><button id="reset-entry-icon" type="button" class="button subtle">恢复默认图标</button></div><div class="entry-secondary"><button id="reveal-entry" type="button" class="button outline"><span data-icon="folder"></span>文件位置</button><button id="remove-entry" type="button" class="button danger"><span data-icon="trash"></span>移除入口</button></div><button type="submit" class="button primary full-width">保存入口</button></form></dialog>
  <script type="module" src="./launcher.mjs"></script></body></html>
